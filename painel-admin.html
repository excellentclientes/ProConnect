<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - ProConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #0f172a; }</style>
</head>
<body class="flex h-screen overflow-hidden text-slate-300">

    <!-- TELA DE LOGIN ADMIN -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center">
        <div class="max-w-sm w-full p-8 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl text-center space-y-6">
            <div class="w-12 h-12 bg-rose-500 text-white rounded-xl mx-auto flex items-center justify-center text-xl font-bold"><i class="fas fa-lock"></i></div>
            <div>
                <h2 class="text-xl font-bold text-white">Acesso Restrito</h2>
                <p class="text-xs text-slate-400 mt-2">Área exclusiva para o administrador.</p>
            </div>
            <button id="btnGoogleLogin" class="w-full flex items-center justify-center gap-3 bg-white text-slate-900 font-bold py-3 px-4 rounded-xl hover:bg-slate-100 transition-all">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Autenticar como Admin
            </button>
        </div>
    </div>

    <!-- PAINEL ADMIN -->
    <div id="mainDashboard" class="flex w-full h-full hidden">
        <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div class="h-20 flex items-center px-6 border-b border-slate-800">
                <h1 class="text-xl font-bold text-white">System<span class="text-rose-500">Admin</span></h1>
            </div>
            <nav class="flex-1 p-4">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-slate-800 text-white rounded-xl font-medium text-sm"><i class="fas fa-users text-rose-500"></i> Assinantes Base</a>
            </nav>
            <div class="p-4"><button id="btnLogout" class="text-sm text-slate-500 hover:text-white"><i class="fas fa-sign-out-alt"></i> Sair do Painel</button></div>
        </aside>

        <main class="flex-1 h-full overflow-y-auto bg-slate-950 p-8 space-y-8">
            <header>
                <h2 class="text-2xl font-bold text-white">Controle de Assinaturas</h2>
                <p class="text-sm text-slate-500">Gerencie quem anuncia na plataforma.</p>
            </header>

            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
                <h3 class="text-sm font-bold text-white mb-4">Credenciais da Plataforma (Mercado Pago)</h3>
                <div class="flex gap-4">
                    <input type="text" id="adminMpToken" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-rose-500" placeholder="Insira o Access Token (APP_USR...)">
                    <button id="btnSalvarToken" class="px-6 py-3 bg-rose-600 text-white rounded-xl font-bold hover:bg-rose-700 transition-colors text-sm">Atualizar Gateway</button>
                </div>
            </div>

            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                <div class="p-6 border-b border-slate-800 flex justify-between">
                    <h3 class="font-bold text-white">Anunciantes Cadastrados</h3>
                    <span class="text-sm font-bold bg-slate-800 px-3 py-1 rounded-lg text-rose-400" id="countUsers">0 usuários</span>
                </div>
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400">
                            <th class="p-4 font-medium">Usuário</th>
                            <th class="p-4 font-medium">E-mail</th>
                            <th class="p-4 font-medium">WhatsApp do Perfil</th>
                            <th class="p-4 font-medium">Status API</th>
                        </tr>
                    </thead>
                    <tbody id="listaAssinantes" class="divide-y divide-slate-800">
                        <!-- Renderizado via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth, provider, db } from './firebase-config.js';
        import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // COLOQUE AQUI O SEU E-MAIL PARA RESTRINGIR O ACESSO
        const MEU_EMAIL_ADMIN = "seuemail@gmail.com"; 

        document.getElementById('btnGoogleLogin').addEventListener('click', () => {
            signInWithPopup(auth, provider);
        });

        document.getElementById('btnLogout').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Trava de Segurança Admin
                if(user.email !== MEU_EMAIL_ADMIN && MEU_EMAIL_ADMIN !== "seuemail@gmail.com") {
                    alert("Acesso Negado. Você não é o administrador.");
                    signOut(auth);
                    return;
                }

                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                carregarUsuarios();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('mainDashboard').classList.add('hidden');
            }
        });

        document.getElementById('btnSalvarToken').addEventListener('click', async () => {
            const tk = document.getElementById('adminMpToken').value;
            if(!tk) return alert("Insira um token válido");
            await setDoc(doc(db, "configuracoes", "admin"), { mercadoPagoToken: tk }, { merge: true });
            alert("Gateway da plataforma salvo com sucesso!");
        });

        async function carregarUsuarios() {
            const tbody = document.getElementById('listaAssinantes');
            const snap = await getDocs(collection(db, "usuarios_anunciantes"));
            let count = 0;
            tbody.innerHTML = '';
            
            snap.forEach(d => {
                count++;
                const u = d.data();
                const zap = u.whatsapp ? `<a href="https://wa.me/${u.whatsapp}" target="_blank" class="text-emerald-400 hover:underline">${u.whatsapp}</a>` : '<span class="text-slate-600">Nenhum</span>';
                const apiSt = u.gatewayKey ? '<span class="text-emerald-500 font-bold">✓ Configurado</span>' : '<span class="text-rose-500 text-xs">Pendente</span>';
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-800/50 transition-colors">
                        <td class="p-4 text-white font-medium">${u.nome || 'Anônimo'}</td>
                        <td class="p-4 text-slate-400">${u.email}</td>
                        <td class="p-4">${zap}</td>
                        <td class="p-4">${apiSt}</td>
                    </tr>
                `;
            });
            document.getElementById('countUsers').innerText = count + ' usuários';
        }
    </script>
</body>
</html>
