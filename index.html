<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConnect - Rede de Serviços</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; color: #0f172a; }
        .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="min-h-full flex flex-col bg-slate-50 antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-heading font-extrabold text-xl">P</div>
                <span class="font-heading font-bold text-lg">ProConnect</span>
            </div>
            <a href="painel-anunciante.html" target="_blank" class="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl hover:bg-slate-800 transition-colors">Anunciar Solução</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-1">
        <!-- Loader -->
        <div id="loader" class="text-center py-20 text-slate-400 font-medium animate-pulse">Carregando anúncios do Firebase...</div>

        <!-- Feed Grid -->
        <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden">
            <!-- Anuncios Injetados Via JS -->
        </div>
    </main>

    <!-- Script de Integração com Firebase -->
    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function loadFeed() {
            const feedDiv = document.getElementById('feed');
            const loader = document.getElementById('loader');
            
            try {
                // Busca anúncios ordenados pela data mais recente
                const q = query(collection(db, "anuncios"), orderBy("dataCriacao", "desc"));
                const querySnapshot = await getDocs(q);
                
                let html = '';
                querySnapshot.forEach((doc) => {
                    const ad = doc.data();
                    
                    // Tratamento de badges de preço/tipo
                    let badgeStyles = "bg-blue-50 text-blue-700 border-blue-100";
                    let displayPrice = `<span class="text-xs font-bold text-slate-500">Sob Orçamento</span>`;
                    
                    if(ad.tipo === 'gratis') {
                        badgeStyles = "bg-emerald-50 text-emerald-700 border-emerald-100";
                        displayPrice = `<span class="text-xs font-bold text-emerald-700">Download Grátis</span>`;
                    } else if (ad.tipo === 'pago') {
                        badgeStyles = "bg-amber-50 text-amber-700 border-amber-100";
                        displayPrice = `<span class="text-sm font-extrabold text-slate-900">R$ ${ad.preco.toFixed(2).replace('.',',')}</span>`;
                    }

                    // Verifica se o anunciante disponibilizou o whatsapp no momento do post
                    const waLink = ad.autor.whatsapp ? `href="https://wa.me/${ad.autor.whatsapp}" target="_blank"` : `onclick="alert('Anunciante sem WhatsApp cadastrado.')"`;

                    html += `
                        <article class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-shadow flex flex-col group">
                            <div class="relative aspect-video overflow-hidden bg-slate-100 border-b border-slate-100">
                                <img src="${ad.imagemBase64}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-3 left-3 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider border shadow-sm ${badgeStyles} bg-white/90 backdrop-blur-sm">
                                    ${ad.tipo}
                                </span>
                            </div>
                            
                            <div class="p-5 flex-1 space-y-3">
                                <div class="flex items-center gap-2">
                                    <img src="${ad.autor.avatar || 'https://via.placeholder.com/40'}" class="w-6 h-6 rounded-full">
                                    <span class="text-xs font-semibold text-slate-700">${ad.autor.nome}</span>
                                    <span class="text-[10px] text-slate-400 ml-auto">${ad.categoria}</span>
                                </div>
                                
                                <h3 class="font-heading font-bold text-sm text-slate-900 line-clamp-2">${ad.titulo}</h3>
                                <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">${ad.descricao}</p>
                            </div>

                            <div class="px-5 py-4 border-t border-slate-100 flex items-center justify-between">
                                <div>${displayPrice}</div>
                                <a ${waLink} class="flex items-center gap-1.5 px-3 py-1.5 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-100 transition-colors cursor-pointer">
                                    <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                                    Contato
                                </a>
                            </div>
                        </article>
                    `;
                });

                if(html === '') html = `<div class="col-span-3 text-center py-20 text-slate-400 font-medium">Nenhum anúncio publicado ainda.</div>`;
                
                loader.classList.add('hidden');
                feedDiv.innerHTML = html;
                feedDiv.classList.remove('hidden');

            } catch (e) {
                loader.innerText = "Erro ao conectar com o banco de dados. " + e.message;
                console.error(e);
            }
        }

        window.onload = loadFeed;
    </script>
</body>
</html>
